<svg width="600" height="140" viewBox="0 0 600 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand Icon Badge -->
  <rect x="10" y="10" width="120" height="120" rx="28" fill="url(#grad1)"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#2a5298" />
    </linearGradient>
  </defs>

  <!-- Graduation Cap & Book Icon -->
  <!-- Cap Top -->
  <polygon points="70,36 108,52 70,68 32,52" fill="#ffffff" />
