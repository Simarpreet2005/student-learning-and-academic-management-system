  <text x="152" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6c757d" letter-spacing="1.5">LEARNING &amp; ACADEMIC SYSTEM</text>
</svg>
