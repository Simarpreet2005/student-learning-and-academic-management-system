{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | Academic LMS{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5 text-center">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-4"
           style="width:80px;height:80px;background:linear-gradient(135deg,#2C6E49,#52B788);">
        <i class="fa-solid fa-circle-check fa-2x text-white"></i>
      </div>
      <h3 class="fw-bold mb-2" style="color: var(--color-primary-espresso);">Password Reset Successful</h3>
      <p class="text-muted mb-4">
        Your password has been set. You can now sign in with your new password.
      </p>
      <a href="{% url 'accounts:login' %}" class="btn btn-espresso">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
      </a>
    </div>
  </div>
</div>
{% endblock content %}
