name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      PYTHONPATH: .
    strategy:
      max-parallel: 4
      matrix:
        # The supported intersection is Python 3.11+: Django 5.2 supports 3.10+,
        # while Pillow 13 requires 3.11+.
        # https://docs.djangoproject.com/en/5.2/faq/install/#what-python-version-can-i-use-with-django
        # https://pillow.readthedocs.io/en/stable/installation/python-support.html
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: academic_lms

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/ci.txt
    - name: Run Django system check
      run: python manage.py check
    - name: Run migration consistency check
      run: python manage.py makemigrations --check --dry-run
    - name: Run Tests
      run: python manage.py test
